<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 4 - Flexbox</title>
    <style>
 body {
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  
}

.flip-card {margin: auto;
}

.flip-card {
  background-color: green;
  width: 300px;
  height: 300px;
  perspective: 1000px;
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 50s linear;
  transform-style: preserve-3d;
  box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
}

.flip-card:hover .flip-card-inner {
  transform: rotateY(3600deg);
}

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
}

.flip-card-front {
  background-color: #bbb;
  color: black;
}

.flip-card-back {
  background-color: #ff6666;
  color: white;
  transform: rotateY(180deg);
}

.title {background-color: #ff6666;
width: 200px;
margin:auto;
margin-bottom: 80px;
margin-top: 80px;
height: 200px;
align-content: center;

animation-name: titlebar;
  animation-duration: 3s; 
  animation-timing-function:linear; 
  animation-iteration-count: infinite; 
  animation-direction: alternate;
}

@keyframes titlebar {
  from {translate: 600px;}
  
  to{translate:-600px}
}

.main {background-color: rgba(0, 0, 255, 0.5);
display: flex;
justify-content:space-around;
padding:20px;}

    </style>
  </head>
